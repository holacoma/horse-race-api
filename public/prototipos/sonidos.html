<!doctype html>
<html lang="es" data-fase="carrera">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sonido-the-world" content="/sonidos/the-world.mp3">
<title>Club Race · Soundboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/identidad.css">
<style>
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 500 14px/1.45 var(--fuente-texto); }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }

  .escenario { position: sticky; top: 0; z-index: 2; background: var(--fondo); padding: 18px 0 12px; border-bottom: 2px solid var(--acento); }
  .titulo { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 10px; }
  h1 { font: 400 32px/1 var(--fuente-titulo); margin: 0; }
  .bajada { margin: 0; color: var(--texto-suave); font-size: 13px; }
  canvas { display: block; width: 100%; height: 150px; background: var(--superficie); }
  .ahora { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; }
  .ahora .nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ahora .tiempo { color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .ahora label { display: flex; align-items: center; gap: 6px; color: var(--texto-suave); }
  .ahora input { width: 100px; accent-color: var(--acento); }

  section { margin-top: 26px; }
  section header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
  h2 { font: 400 22px/1.1 var(--fuente-titulo); margin: 0; }
  .cuando { color: var(--texto-suave); font-size: 12px; }
  .pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .vacio { color: var(--texto-suave); font-size: 13px; }

  .pad {
    position: relative; display: grid; gap: 4px; align-content: start; min-height: 74px; padding: 12px 40px 16px 14px;
    background: var(--superficie); color: var(--texto); border: 1px solid var(--borde-sutil); border-left: var(--borde-marcado) solid var(--acento);
    text-align: left; font: inherit; cursor: pointer; box-shadow: 4px 4px 0 #000;
  }
  .pad:hover { border-color: var(--acento); }
  .pad:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  .pad .nombre { font-weight: 700; overflow-wrap: anywhere; }
  .pad .dura { color: var(--texto-suave); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pad .barra { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--acento); }
  .pad.sonando { background: color-mix(in oklch, var(--acento) 22%, var(--superficie)); border-color: var(--acento); }
  .pad .queda {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; display: grid; place-items: center;
    color: var(--texto-suave); font-size: 16px; line-height: 1;
  }
  .pad .queda:hover { color: var(--texto); }
  .pad.elegido .queda { color: var(--acento); }
  .pad.elegido { outline: 2px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="escenario">
    <div class="titulo">
      <h1>Soundboard</h1>
      <p class="bajada">Dejá archivos en <code>public/sonidos/candidatos/&lt;momento&gt;/</code>: aparecen solos. Clic para escuchar, ★ para marcar cuál queda.</p>
    </div>
    <canvas id="espectro"></canvas>
    <div class="ahora">
      <span class="nombre" id="ahora">Nada sonando</span>
      <span class="tiempo" id="tiempo"></span>
      <label>vol <input type="range" id="volumen" min="0" max="1.5" step="0.05"></label>
    </div>
  </div>
  <div id="momentos"></div>
</main>

<script type="module">
// Todo lo que suena en la página pasa por un analizador, también los sonidos sintetizados del juego (sonidos.js crea su propio
// contexto): por eso se reemplaza AudioContext antes de importarlo, y su "destination" es la entrada de un analizador.
const analizadores = []
const Base = window.AudioContext || window.webkitAudioContext
let proto = Base.prototype
while (!Object.getOwnPropertyDescriptor(proto, "destination")) proto = Object.getPrototypeOf(proto)
const destinoReal = Object.getOwnPropertyDescriptor(proto, "destination").get
let volumen = 1
try { volumen = Number(localStorage.getItem("soundboard.volumen") ?? 1) } catch {}
class Contexto extends Base {
  constructor(...args) {
    super(...args)
    this.entrada = this.createGain()
    this.entrada.gain.value = volumen
    this.analizador = this.createAnalyser()
    this.analizador.fftSize = 4096
    this.analizador.smoothingTimeConstant = 0.78
    // Más rango que el de fábrica (-100 a -30 dB), que con música mezclada fuerte deja todas las barras arriba.
    this.analizador.minDecibels = -85
    this.analizador.maxDecibels = -12
    this.entrada.connect(this.analizador).connect(destinoReal.call(this))
    analizadores.push(this)
  }
  get destination() { return this.entrada }
}
window.AudioContext = Contexto
window.webkitAudioContext = Contexto
const { sonar } = await import("/sonidos.js")

const MOMENTOS = {
  inicio: "Al abrir la carrera: 13 s de presentación y 3, 2, 1 hasta el ¡YA!",
  transformacion: "Cuando la cámara va al caballo de fuego, casi en el ¡YA!",
  final: "Al cruzar la meta y en el festejo del ganador"
}
// Los que suenan hoy en el juego, sintetizados en sonidos.js, para comparar.
const ACTUALES = [
  ["tiempo", "El mundo se detiene", 4.2], ["cuenta", "Cuenta 3", 0.8, 3], ["cuenta", "Cuenta 1", 0.8, 1], ["ya", "¡YA! (riff de largada)", 3],
  ["meta", "Meta", 2.3], ["ganador", "Ganador", 2.5], ["moneda", "Moneda", 0.4], ["premio", "Premio", 0.4], ["click", "Clic", 0.1]
]

const ctx = new Contexto()
const buffers = {}
let actual = null // { pad, src?, inicio, dura, nombre }
let datos = { momentos: {}, elegidos: {} }
let firma = ""

const volInput = document.getElementById("volumen")
volInput.value = volumen
volInput.addEventListener("input", () => {
  volumen = Number(volInput.value)
  analizadores.forEach(c => { c.entrada.gain.value = volumen })
  try { localStorage.setItem("soundboard.volumen", volumen) } catch {}
})

const cargar = url => (buffers[url] ??= fetch(url).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b)))
const segundos = s => `${s.toLocaleString("es", { maximumFractionDigits: 1, minimumFractionDigits: 1 })} s`
const reloj = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`

function callar() {
  if (!actual) return
  try { actual.src?.stop() } catch {}
  actual.pad.classList.remove("sonando")
  actual.pad.querySelector(".barra").style.width = "0"
  actual = null
  document.getElementById("ahora").textContent = "Nada sonando"
  document.getElementById("tiempo").textContent = ""
}

function empezar(pad, nombre, dura, src = null) {
  actual = { pad, src, nombre, dura, inicio: performance.now() }
  pad.classList.add("sonando")
  document.getElementById("ahora").textContent = `▶ ${nombre}`
}

async function tocarArchivo(pad, archivo) {
  if (actual?.pad === pad) return callar()
  callar()
  ctx.resume()
  const buffer = await cargar(archivo.url).catch(error => { console.warn("no se pudo leer", archivo.url, error); return null })
  if (!buffer) return
  const src = ctx.createBufferSource()
  src.buffer = buffer
  src.connect(ctx.destination)
  src.onended = () => { if (actual?.src === src) callar() }
  src.start()
  empezar(pad, archivo.nombre, buffer.duration, src)
}

function tocarActual(pad, [nombre, titulo, dura, arg]) {
  callar()
  if (sonar(nombre, ...(arg === undefined ? [] : [arg]))) empezar(pad, titulo, dura)
}

// ── Pads ────────────────────────────────────────────────────────────────────
function pad(nombre) {
  const b = document.createElement("button")
  b.type = "button"
  b.className = "pad"
  b.innerHTML = `<span class="nombre"></span><span class="dura"></span><span class="barra"></span>`
  b.querySelector(".nombre").textContent = nombre
  return b
}

function seccion(titulo, cuando) {
  const sec = document.createElement("section")
  sec.innerHTML = `<header><h2></h2><span class="cuando"></span></header><div class="pads"></div>`
  sec.querySelector("h2").textContent = titulo
  sec.querySelector(".cuando").textContent = cuando
  return sec
}

function pintar() {
  const sonandoUrl = actual?.pad.dataset.url
  const cont = document.getElementById("momentos")
  cont.innerHTML = ""
  for (const [momento, archivos] of Object.entries(datos.momentos)) {
    const sec = seccion(momento, MOMENTOS[momento] ?? "")
    const pads = sec.querySelector(".pads")
    if (!archivos.length) pads.outerHTML = `<p class="vacio">Vacío: dejá archivos en <code>candidatos/${momento}/</code></p>`
    for (const a of archivos) {
      const b = pad(a.nombre)
      b.dataset.url = a.url
      b.classList.toggle("elegido", datos.elegidos[momento] === a.nombre)
      const queda = document.createElement("span")
      queda.className = "queda"
      queda.title = "Queda"
      queda.textContent = datos.elegidos[momento] === a.nombre ? "★" : "☆"
      queda.addEventListener("click", e => { e.stopPropagation(); elegir(momento, datos.elegidos[momento] === a.nombre ? null : a.nombre) })
      b.append(queda)
      cargar(a.url).then(buf => { b.querySelector(".dura").textContent = segundos(buf.duration) }).catch(() => { b.querySelector(".dura").textContent = "no se pudo leer" })
      b.addEventListener("click", () => tocarArchivo(b, a))
      if (a.url === sonandoUrl) { actual.pad = b; b.classList.add("sonando") }
      pads.append(b)
    }
    cont.append(sec)
  }
  const sec = seccion("Actuales del juego", "Sintetizados en sonidos.js, para comparar")
  for (const sonido of ACTUALES) {
    const b = pad(sonido[1])
    b.querySelector(".dura").textContent = segundos(sonido[2])
    b.addEventListener("click", () => tocarActual(b, sonido))
    sec.querySelector(".pads").append(b)
  }
  cont.append(sec)
}

async function elegir(momento, archivo) {
  const r = await fetch("/prototipos/sonidos/elegir", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ momento, archivo }) })
  if (!r.ok) return console.warn("no se pudo guardar", momento, archivo)
  datos.elegidos = (await r.json()).elegidos
  firma = JSON.stringify(datos)
  pintar()
}

// Revisa la carpeta cada 3 s: los archivos nuevos aparecen sin recargar.
async function refrescar() {
  if (document.hidden) return
  const r = await fetch("/prototipos/sonidos/candidatos").catch(() => null)
  if (!r?.ok) return
  const nuevos = await r.json()
  const f = JSON.stringify(nuevos)
  if (f === firma) return
  firma = f
  datos = nuevos
  pintar()
}
await refrescar()
setInterval(refrescar, 3000)

// ── Espectro ────────────────────────────────────────────────────────────────
// Barras en escala logarítmica de 30 Hz a 16 kHz, en tinta: carmesí con sombra negra desplazada, sin brillo.
const canvas = document.getElementById("espectro")
const g = canvas.getContext("2d")
const BARRAS = 72
const alturas = new Float32Array(BARRAS)
const picos = new Float32Array(BARRAS)
const datosFft = new Uint8Array(2048)
const color = getComputedStyle(document.documentElement).getPropertyValue("--acento").trim() || "crimson"
const tenue = getComputedStyle(document.documentElement).getPropertyValue("--borde-sutil").trim() || "#333"

function dibujar() {
  const dpr = devicePixelRatio || 1
  const w = canvas.clientWidth, h = canvas.clientHeight
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr) }
  g.setTransform(dpr, 0, 0, dpr, 0, 0)
  g.clearRect(0, 0, w, h)

  const nivel = new Float32Array(BARRAS)
  for (const c of analizadores) {
    if (c.state !== "running") continue
    const a = c.analizador
    a.getByteFrequencyData(datosFft)
    const hzPorBin = c.sampleRate / a.fftSize
    for (let i = 0; i < BARRAS; i++) {
      const desde = 30 * Math.pow(16000 / 30, i / BARRAS), hasta = 30 * Math.pow(16000 / 30, (i + 1) / BARRAS)
      const b0 = Math.floor(desde / hzPorBin), b1 = Math.max(b0 + 1, Math.ceil(hasta / hzPorBin))
      let max = 0
      for (let b = b0; b < b1 && b < a.frequencyBinCount; b++) max = Math.max(max, datosFft[b])
      nivel[i] = Math.max(nivel[i], max / 255)
    }
  }

  const paso = w / BARRAS, ancho = Math.max(2, paso - 3)
  for (let i = 0; i < BARRAS; i++) {
    alturas[i] = nivel[i] > alturas[i] ? nivel[i] : alturas[i] * 0.9 + nivel[i] * 0.1
    picos[i] = Math.max(alturas[i], picos[i] - 0.006)
    const x = i * paso, alto = Math.max(2, alturas[i] * (h - 10))
    g.fillStyle = "#000"
    g.fillRect(x + 3, h - alto + 3, ancho, alto)
    g.fillStyle = color
    g.fillRect(x, h - alto, ancho, alto)
    g.fillStyle = tenue
    g.fillRect(x, h - picos[i] * (h - 10) - 4, ancho, 2)
  }

  if (actual) {
    const t = (performance.now() - actual.inicio) / 1000
    actual.pad.querySelector(".barra").style.width = `${Math.min(100, (t / actual.dura) * 100)}%`
    document.getElementById("tiempo").textContent = `${reloj(Math.min(t, actual.dura))} / ${reloj(actual.dura)}`
    if (!actual.src && t > actual.dura + 0.3) callar()
  }
  requestAnimationFrame(dibujar)
}
requestAnimationFrame(dibujar)
</script>
</body>
</html>
